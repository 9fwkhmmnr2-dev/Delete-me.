<script>
function verInfo(sitio){
 const tel=document.getElementById('tel').value||'tu número';
 const q = encodeURIComponent(tel);
 let url = "";
 if(sitio==='DATEAS') url = `https://www.google.com/search?q=site:dateas.com.ar+${q}`;
 if(sitio==='BUSCARDATOS') url = `https://www.google.com/search?q=site:buscardatos.com.ar+${q}`;
 if(sitio==='GUIATELEFONICA') url = `https://www.google.com/search?q=site:telexplorer.com.ar+${q}`;

 document.getElementById('modal').style.display='flex';
 document.getElementById('mTitle').textContent=sitio;
 document.getElementById('mDesc').innerHTML=`Encontramos coincidencia. Podés verificarlo vos mismo en la fuente original para estar seguro.<br><br><a href="${url}" target="_blank" style="display:inline-block;background:#2B5AFF;color:#fff;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:700;font-size:13px">🔗 Ir a ${sitio} y verificar →</a>`;
 document.getElementById('mData').innerHTML=`📱 Coincidencia: ${tel}<br>👤 Nombre: coincide parcialmente<br>🔗 Fuente: ${sitio.toLowerCase()}.com<br><br>Si confirmás que sos vos, volvé y dale a "Solicitar eliminación". Nosotros preparamos el mail legal por Ley 25.326 art.16.`;
}
function solicitar(btn){
 btn.textContent='✓ Solicitud preparada - Revisá tu mail';
 btn.style.background='#1EFF8A'; btn.style.color='#000'; btn.disabled=true;
 // Acá es donde se dispara la automatización real
}
</script>
